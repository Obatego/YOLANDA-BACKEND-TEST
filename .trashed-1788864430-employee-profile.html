<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yolanda | Employee Profile & Reports</title><link rel="stylesheet" href="./yolanda.css"></head><body class="portal-body"><div class="portal-wrap container"><div class="portal-nav"><a class="portal-brand" href="index.html"><img src="./assets/yolanda-company-logo.png" alt="Yolanda"><span>YOLANDA EMPLOYEE PORTAL</span></a><div class="portal-links"><a class="btn alt" href="dashboard.html">Dashboard</a><a class="btn alt" href="index.html">Home</a></div></div><div class="eyebrow">Profile</div><h1 class="section-title">Your workspace.</h1><div class="glass panel" style="margin-bottom:22px"><h2>Employee Profile</h2><form id="profileForm" class="form-grid"><div class="field"><label>Name</label><input name="name" value="Yolanda Employee"></div><div class="field"><label>Email</label><input name="email" value="employee@yolanda.test"></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Department</label><input name="department" value="Operations"></div><div class="field"><label>Role</label><input name="role" value="Call Center Agent"></div><div class="field"><label>Profile Picture</label><input name="photo" type="file" accept="image/*"></div><div class="field full"><button class="btn" type="submit">Save Profile</button></div></form></div><div class="glass panel"><div class="eyebrow">Daily / Weekly Work Report</div><h2>Submit a report</h2><form id="reportForm" class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Shift</label><select name="shift"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div><div class="field"><label>Leads to Income</label><input name="leads" type="number" min="0"></div><div class="field"><label>Total Number Called</label><input name="totalCalled" type="number" min="0"></div><div class="field"><label>Total Spoken To</label><input name="spokenTo" type="number" min="0"></div><div class="field"><label>Income Gotten</label><input name="income" placeholder="₦0"></div><div class="field"><label>Total Not Spoken / Not Reachable</label><input name="notReached" type="number" min="0"></div><div class="field"><label>Line Busy</label><input name="busy" type="number" min="0"></div><div class="field"><label>Switched Off</label><input name="switchedOff" type="number" min="0"></div><div class="field"><label>Wrong Number</label><input name="wrongNumber" type="number" min="0"></div><div class="field"><label>Duplicate Numbers</label><input name="duplicates" type="number" min="0"></div><div class="field"><label>SMS Sent</label><input name="smsSent" type="number" min="0"></div><div class="field full"><label>Yolanda Message Report — Total Number Engaged</label><input name="messageEngaged" type="number" min="0"></div><div class="field"><label>Total Messages Sent</label><input name="messagesSent" type="number" min="0"></div><div class="field"><label>Duplicate Information</label><input name="duplicateInformation"></div><div class="field"><label>Handles Not Found</label><input name="handlesNotFound"></div><div class="field full"><label>Observations / Summary / Blockers / Accomplishments</label><textarea name="summary" rows="5"></textarea></div><div class="field full"><label>Attachment</label><input name="attachment" type="file" accept=".pdf,.csv,image/*"></div><div class="field full"><button class="btn" type="submit">Submit Work Report</button></div></form></div></div><div class="toast"></div><script src="js/profile.js"></script></body></html>
